<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gran Torino: desenvolvimento</title>
<style>

:root{--bg:#f6f4ef;--fg:#1d1b18;--mut:#6b665e;--card:#fff;--line:#d9d4c9;--pos:#2f7d4f;--neg:#b23a3a;--acc:#1f4e79;--a1:#e8eef5;--a2:#f3ece0;--a3:#efe6ee;--a4:#e6efe6}
@media(prefers-color-scheme:dark){:root{--bg:#16150f;--fg:#ece8df;--mut:#9a948a;--card:#201f18;--line:#3a382e;--pos:#5fc388;--neg:#e07a7a;--acc:#7fb2e0;--a1:#1c2630;--a2:#2a251a;--a3:#2a1f29;--a4:#1d2a1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,sans-serif}
.sticky{position:sticky;top:var(--nav-h);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}
.sticky .in{max-width:1100px;margin:0 auto}
svg{width:100%;height:auto;display:block;overflow:visible}
.passos{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:.85rem;color:var(--mut)}
button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:8px 16px 80px}
.ato{margin-top:24px;border-radius:10px;padding:12px 12px 4px}
.ato h2{margin:0 0 2px;font-size:1.1rem}
.ato .pg{color:var(--mut);font-size:.85rem;margin-bottom:10px}
.cena{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mut);border-radius:8px;padding:10px 12px;margin-bottom:10px;scroll-margin-top:290px;cursor:pointer}
.cena.pos{border-left-color:var(--pos)}.cena.neg{border-left-color:var(--neg)}.cena.mix{border-left-color:#c9a227}
.cena.on{outline:2px solid var(--acc)}
.num{text-align:center}.num b{display:block;font-size:1.5rem;line-height:1.1}.num span{font-size:.75rem;color:var(--mut)}
.cena h3{margin:0;font-size:1rem}
.beat{display:inline-block;font-size:.72rem;background:var(--a1);color:var(--acc);padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.cena p{margin:4px 0}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;font-size:.85rem}
.meta div{background:var(--bg);border-radius:6px;padding:6px 8px}
.meta small{display:block;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-size:.68rem}
@media(max-width:600px){.meta{grid-template-columns:1fr}.cena{grid-template-columns:48px 1fr}}
.ajuda{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:.88rem}
.ajuda summary{cursor:pointer;font-weight:600}
.ajuda ul{margin:8px 0 2px;padding-left:18px}.ajuda li{margin-bottom:5px}
.d{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.d.pos{background:var(--pos)}.d.neg{background:var(--neg)}.d.mix{background:#c9a227}
.cena h3{font-size:.95rem;letter-spacing:.02em}
.tp{position:relative;cursor:help;border-bottom:1px dotted var(--mut)}
.tp.vazio{color:var(--mut);font-style:italic}
.tp::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:max-content;max-width:min(300px,80vw);background:var(--fg);color:var(--bg);font:400 .8rem/1.4 system-ui,sans-serif;letter-spacing:0;text-transform:none;font-style:normal;padding:6px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s}
.tp:hover::after,.tp:focus::after{opacity:1;visibility:visible}
.det{font-weight:400;color:var(--mut);text-transform:none}
.elenco{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.elenco small{color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-size:.68rem}
.tp.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:0 9px;font-size:.78rem}

:root{--nav-h:52px;--ok:#2f7d4f;--par:#c9a227;--abe:#9a948a}
.topo{position:sticky;top:0;z-index:30;height:var(--nav-h);background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:stretch}
.topo .in{max-width:1100px;margin:0 auto;width:100%;display:flex;align-items:stretch;gap:4px;padding:0 8px;overflow-x:auto;scrollbar-width:thin}
.topo a{display:flex;align-items:center;gap:7px;padding:0 12px;white-space:nowrap;color:var(--mut);text-decoration:none;font-size:.88rem;border-bottom:3px solid transparent}
.topo a:hover{color:var(--fg)}
.topo a.on{color:var(--fg);font-weight:600;border-bottom-color:var(--acc)}
.topo a .n{font-size:.72rem;border:1px solid var(--line);border-radius:99px;min-width:20px;text-align:center;padding:0 5px}
.topo a.home{font-weight:700;color:var(--fg)}
.bol{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--abe);flex:none}
.bol.concluida{background:var(--ok)}.bol.andamento,.bol.rascunho{background:var(--par)}
.pag{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.pag h1{margin:0 0 4px;font-size:1.5rem}
.sub{color:var(--mut);margin:0 0 14px}
.termos{margin:0}
.termos dt{font-weight:700;margin-top:10px}
.termos dd{margin:2px 0 0}
.termos .ex{display:block;margin-top:3px;font-size:.88rem;color:var(--mut)}
.termos .ex b{color:var(--fg)}
.rot{display:block;text-transform:uppercase;letter-spacing:.05em;font-size:.68rem;font-weight:700}
.sec{font-size:1.15rem;margin:18px 0 0;padding-top:12px;border-top:2px solid var(--line)}
.badge{display:inline-block;font-size:.75rem;padding:1px 10px;border-radius:99px;border:1px solid var(--line);vertical-align:middle;margin-left:8px;font-weight:600}
.badge.concluida{color:var(--ok);border-color:var(--ok)}.badge.andamento,.badge.rascunho{color:#8a6d00;border-color:var(--par)}
.painel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}
.painel h2{margin:0 0 8px;font-size:1rem}
.painel ul{margin:6px 0;padding-left:20px}.painel li{margin-bottom:5px}
.painel li.grupo{list-style:none;margin:0 0 14px -20px}.painel li.grupo>b{display:block;margin-bottom:4px}.painel li.grupo>ul{margin:0;padding-left:22px}
.painel p{margin:6px 0}
.crit{list-style:none;padding:0!important}
.crit li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.crit .ic{font-weight:700}
.crit .ok{color:var(--ok)}.crit .parcial{color:#8a6d00}.crit .aberto{color:var(--mut)}
.crit small{display:block;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t th{color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card:hover{border-color:var(--acc)}
.card h3{margin:0 0 4px;font-size:1rem}
.card p{margin:4px 0;color:var(--mut);font-size:.85rem}
.barra{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--ok)}
.nav2{display:flex;justify-content:space-between;margin-top:24px}
.nav2 a{color:var(--acc);text-decoration:none}
code{background:var(--bg);padding:0 4px;border-radius:4px;font-size:.88em}
</style>
</head>
<body>
<nav class="topo" aria-label="Etapas"><div class="in" id="topo"></div></nav>
<div id="app"></div>
<script>
const AJUDA=`<details open class="ajuda">
<summary>Como ler o gráfico</summary>
<ul>
<li><b>Cada ponto é uma cena</b>, colocada na página do filme em que ela acontece (1 a 50).</li>
<li><b>Altura = como a rabugenta termina a cena.</b> Quanto mais alto, melhor para ela: mais em paz, mais aberta, mais perto dos outros. Quanto mais baixo, pior: mais pressionada, humilhada, sozinha ou sem saída. A linha tracejada é o ponto neutro.</li>
<li><b>Subir</b> = a cena a leva para algo melhor. <b>Descer</b> = a cena a empurra para algo pior. A descida longa do meio ao fim do Ato 2 é ela sendo cercada por uma bondade que não sabe receber (o "tudo perdido"); a subida do Ato 3 é ela escolhendo dar graça.</li>
<li><b>Cor do ponto:</b> <span class="d pos"></span> termina melhor (+) · <span class="d neg"></span> termina pior (−) · <span class="d mix"></span> misto: ganha e perde ao mesmo tempo (+/− ou −/+).</li>
<li>É a situação <b>dela</b>, não do menino nem da família. Numa cena em que o menino sofre mas ela se aproxima dele, o ponto sobe.</li>
<li>A faixa colorida ao fundo marca os atos. Uma cena que não muda nada para ela, para cima ou para baixo, não deveria existir.</li>
</ul>
</details>`;
Promise.all([fetch('etapas.json').then(r=>r.json()),fetch('cenas.json').then(r=>r.json())]).then(([ETAPAS,ATOS])=>{
const cores=['--a1','--a2','--a3','--a4','--a2','--a1'];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');

const TIP={
INT:'INT. (interior): a cena acontece dentro de um espaço fechado, como uma casa ou uma sala.',
EXT:'EXT. (exterior): a cena acontece ao ar livre, como a rua, o portão ou o jardim.',
'?ie':'Ainda não definido: a cena mistura espaços internos e externos, ou o local não diz qual é. Decidir.',
local:'Local da cena. O mesmo lugar deve ter sempre o mesmo nome em todas as cenas.',
'manhã':'MANHÃ: começo do dia, luz clara e rotina de saída.',
dia:'DIA: a cena acontece com luz do dia, sem hora específica.',
tarde:'TARDE: depois do meio-dia, antes do pôr do sol.',
entardecer:'ENTARDECER: fim da tarde, luz baixa, perto do pôr do sol.',
noite:'NOITE: a cena acontece depois de escurecer.',
'contínuo':'CONTÍNUO: segue direto da cena anterior, no mesmo lugar e na mesma hora, sem pulo no tempo.',
'?h':'Hora do dia ainda não definida para esta cena.',
detalhe:'Detalhe do momento ou do espaço dentro do local.'};
const PAPEL={
'Rabugenta':'Protagonista. 40 anos, vizinha de longa data, cuidou do pai por cerca de 20 anos até a morte dele.',
'Menino':'11 anos. Filho mais novo da família que se muda para a rua.',
'Irmã':'15 anos. Irmã do menino. Ama a Deus e a ciência, e vira aliada da rabugenta.',
'Pai':'44 anos. Pai do menino e da irmã. Instala as câmeras e impõe o castigo.',
'Mãe':'41 anos. Mãe do menino e da irmã. Tenta a amizade com a rabugenta.',
'Vilãozinho':'12 anos. Menino problema da rua. Pai preso, mãe drogada, mora com a avó.',
'Avó':'55 anos. Avó do vilãozinho e vizinha antiga da rabugenta.',
'Pet':'Vira-lata velho que era do pai da rabugenta. Vive à porta, esperando por ele.',
'Treinador':'Da igreja, treina a escolinha de futebol e coordena a célula.',
'Meninos da rua':'Grupo de meninos que joga bola na rua e segue o vilãozinho.'};
const elenco=c=>(c.elenco||[]).map(n=>tip(n,PAPEL[n]||n,'chip')).join('');
const tip=(txt,tx,cls='')=>`<span class="tp ${cls}" tabindex="0" data-tip="${esc(tx)}">${esc(txt)}</span>`;
const slug=c=>[
  c.int_ext?tip(c.int_ext+'.',TIP[c.int_ext]):tip('INT/EXT?',TIP['?ie'],'vazio'),
  tip(c.local.toUpperCase(),TIP.local),
  '–',
  c.hora?tip(c.hora.toUpperCase(),TIP[c.hora]):tip('HORA?',TIP['?h'],'vazio'),
  c.detalhe?'<span class="det">('+tip(c.detalhe,TIP.detalhe)+')</span>':''
].join(' ');
const slugTxt=c=>`${c.int_ext?c.int_ext+'. ':''}${c.local.toUpperCase()} – ${c.hora?c.hora.toUpperCase():'?'}`;
const todas=ATOS.flatMap((a,i)=>a.cenas.map(c=>({...c,ato:i})));
const W=1000,H=150,PL=30,PR=10,T=14,B=26,MAXP=50;
const x=p=>PL+(p-1)/(MAXP-1)*(W-PL-PR);
const y=s=>T+(1-(s+1)/2)*(H-T-B);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n);


const app=document.getElementById('app');
let atual=1,etapaAtual=null;
const ic={ok:'✓',parcial:'~',aberto:'○'};
const pontos=e=>e.criterios.filter(x=>x.s==='ok').length+'/'+e.criterios.length;
const tit=e=>`<h1>${e.id}. ${esc(e.nome)}<span class="badge ${e.status}">${esc(e.statusTxt)}</span></h1>`;

function topo(sel){
  document.getElementById('topo').innerHTML=`<a class="home ${sel==null?'on':''}" href="#/">Visão geral</a>`+
    ETAPAS.map(e=>`<a class="${sel===e.id?'on':''}" href="#/etapa/${e.id}" title="${esc(e.nome)}: ${esc(e.statusTxt)}"><span class="bol ${e.status}"></span><span class="n">${e.id}</span>${esc(e.curto)}</a>`).join('');
  const on=document.querySelector('.topo a.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
}

function visao(){
  app.innerHTML=`<div class="pag"><h1>Gran Torino: desenvolvimento</h1>
  <p class="sub">Filme de 40 a 60 minutos (cerca de 50 páginas). Cada etapa tem o que já foi decidido, o que falta e o critério para passar à seguinte.</p>
  <div class="painel"><b>Legenda:</b> <span class="bol concluida"></span> concluída · <span class="bol andamento"></span> em andamento · <span class="bol"></span> não iniciada. A barra de cada etapa mostra quantos critérios já passam.</div>
  <div class="cards">${ETAPAS.map(e=>{const ok=e.criterios.filter(x=>x.s==='ok').length;return `<a class="card" href="#/etapa/${e.id}">
  <h3><span class="bol ${e.status}"></span> ${e.id}. ${esc(e.nome)}</h3><p>${esc(e.resumo)}</p>
  <p><b>${esc(e.statusTxt)}</b> · ${pontos(e)} critérios</p><div class="barra"><i style="width:${ok/e.criterios.length*100}%"></i></div></a>`}).join('')}</div></div>`;
}

function bloco(b){
  if(b.tipo==='texto')return `<section class="painel"><h2>${esc(b.titulo)}</h2><p>${esc(b.texto)}</p></section>`;
  if(b.tipo==='lista')return `<section class="painel"><h2>${esc(b.titulo)}</h2>${b.intro?`<p>${esc(b.intro)}</p>`:''}<ul>${b.itens.map(i=>typeof i==='string'?`<li>${esc(i)}</li>`:`<li class="grupo"><b>${esc(i.t)}</b><ul>${i.sub.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></li>`).join('')}</ul></section>`;
  if(b.tipo==='tabela')return `<section class="painel"><h2>${esc(b.titulo)}</h2><div class="tw"><table class="t"><thead><tr>${b.colunas.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${b.linhas.map(l=>`<tr>${l.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  return '';
}

function etapa(id){
  const i=ETAPAS.findIndex(x=>x.id===id),e=ETAPAS[i],ant=ETAPAS[i-1],prox=ETAPAS[i+1];
  const cab=`<div class="pag" style="padding-bottom:0">${tit(e)}<p class="sub"><small class="rot">O que é esta etapa</small>${esc(e.resumo)}</p>
  <div class="grid2"><section class="painel"><h2>O que esta etapa entrega</h2><ul>${e.entregas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
  <section class="painel"><h2>Para passar à próxima (${pontos(e)})</h2><ul class="crit">${e.criterios.map(c=>`<li><span class="ic ${c.s}">${ic[c.s]}</span><span>${esc(c.t)}${c.n?`<small>${esc(c.n)}</small>`:''}</span></li>`).join('')}</ul></section></div></div>`;
  const termos=e.explica?`<div class="pag" style="padding-top:0;padding-bottom:0"><section class="painel"><h2>Termos desta etapa</h2><dl class="termos">${e.explica.map(t=>`<dt>${esc(t.termo)}</dt><dd>${esc(t.def)}<span class="ex"><b>No seu filme:</b> ${esc(t.ex)}</span></dd>`).join('')}</dl></section></div>`:'';
  const rod=`<div class="nav2">${ant?`<a href="#/etapa/${ant.id}">← ${ant.id}. ${esc(ant.nome)}</a>`:'<span></span>'}${prox?`<a href="#/etapa/${prox.id}">${prox.id}. ${esc(prox.nome)} →</a>`:'<span></span>'}</div>`;
  const temCenas=e.conteudo.some(b=>b.tipo==='cenas');
  const resto=e.conteudo.filter(b=>b.tipo!=='cenas').map(bloco).join('');
  app.innerHTML=cab+termos+(temCenas?cenasHtml():'')+`<div class="pag" style="padding-top:8px"><h2 class="sec">O que já está decidido no seu filme</h2>${resto||'<p class="sub">Nada ainda: esta etapa não foi iniciada.</p>'}${rod}</div>`;
  if(temCenas)iniciaCenas();
}

function cenasHtml(){
  return `<div class="pag" style="padding-bottom:0;padding-top:0">${AJUDA}</div>
  <div class="sticky"><div class="in"><svg id="grafico" viewBox="0 0 1000 150" role="img" aria-label="Curva de valor da protagonista ao longo das páginas"></svg>
  <div class="passos"><button id="ant">← anterior</button><button id="prox">próxima →</button><span id="status"></span></div></div></div>
  <main id="lista">${ATOS.map((a,i)=>`
  <section class="ato" style="background:var(${cores[i]})">
  <h2>${esc(a.nome)}</h2><div class="pg">páginas ${a.ini} a ${a.fim} · ${a.cenas.length} cenas</div>
  ${a.cenas.map(c=>`<article class="cena ${c.score>0.5?'pos':c.score<-0.5?'neg':'mix'}" id="c${c.n}" data-n="${c.n}">
  <div class="num"><b>${c.n}</b><span>pág. ${c.pag}</span></div>
  <div><h3>${slug(c)}<span class="beat">${esc(c.beat)}</span></h3>
  <div class="elenco"><small>Elenco</small>${elenco(c)}</div>
  <p>${esc(c.acontece)}</p>
  <div class="meta"><div><small>Valor</small>${esc(c.valor)}</div><div><small>Conflito</small>${esc(c.conflito)}</div></div></div>
  </article>`).join('')}
  </section>`).join('')}</main>`;
}

function iniciaCenas(){
  document.getElementById('grafico').addEventListener('click',e=>{const n=e.target.dataset?.n;if(n)vai(+n)});
  document.getElementById('lista').addEventListener('click',e=>{const a=e.target.closest('.cena');if(a)vai(+a.dataset.n,false)});
  document.getElementById('ant').onclick=()=>vai(atual-1);
  document.getElementById('prox').onclick=()=>vai(atual+1);
  atual=1;vai(1,false);
}
function desenha(sel){
  const svg=document.getElementById('grafico');if(!svg)return;
  const mut=css('--mut'),pos=css('--pos'),neg=css('--neg'),acc=css('--acc'),line=css('--line');
  let h='';
  ATOS.forEach((a,i)=>{h+=`<rect x="${x(a.ini)}" y="${T}" width="${x(a.fim)-x(a.ini)}" height="${H-T-B}" fill="${css(cores[i])}"/>
  <text x="${(x(a.ini)+x(a.fim))/2}" y="${T-3}" font-size="10" text-anchor="middle" fill="${mut}">${a.nome.replace('Ato 2, ','2')}</text>`});
  h+=`<line x1="${PL}" x2="${W-PR}" y1="${y(0)}" y2="${y(0)}" stroke="${line}" stroke-dasharray="4 3"/>
  <text x="${W-PR}" y="${y(1)-2}" font-size="10" text-anchor="end" fill="${pos}">▲ melhor para ela</text><text x="${W-PR}" y="${y(-1)+10}" font-size="10" text-anchor="end" fill="${neg}">▼ pior para ela</text>`;
  for(let p=1;p<=50;p+=7)h+=`<text x="${x(p)}" y="${H-8}" font-size="10" text-anchor="middle" fill="${mut}">p.${p}</text>`;
  h+=`<polyline fill="none" stroke="${mut}" stroke-width="1.5" points="${todas.map(c=>x(c.pag)+','+y(c.score)).join(' ')}"/>`;
  h+=todas.map(c=>`<circle data-n="${c.n}" cx="${x(c.pag)}" cy="${y(c.score)}" r="${c.n===sel?8:5}" fill="${c.score>0.5?pos:c.score<-0.5?neg:'#c9a227'}" stroke="${c.n===sel?acc:'none'}" stroke-width="3" style="cursor:pointer"><title>${c.n}. ${slugTxt(c)}</title></circle>`).join('');
  svg.innerHTML=h;
}
function vai(n,rolar=true){
  n=Math.max(1,Math.min(todas.length,n));atual=n;
  document.querySelectorAll('.cena.on').forEach(e=>e.classList.remove('on'));
  const el=document.getElementById('c'+n);if(!el)return;el.classList.add('on');
  if(rolar)el.scrollIntoView({behavior:'smooth',block:'start'});
  const c=todas[n-1];
  document.getElementById('status').textContent=`Cena ${n} de ${todas.length} · pág. ${c.pag} · ${c.beat}`;
  desenha(n);
}
addEventListener('keydown',e=>{if(etapaAtual!==4)return;if(e.key==='ArrowRight')vai(atual+1);if(e.key==='ArrowLeft')vai(atual-1)});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>desenha(atual));

function rota(){
  const m=location.hash.match(/^#\/etapa\/(\d+(?:\.\d+)?)$/);
  const id=m&&ETAPAS.some(x=>x.id===+m[1])?+m[1]:null;
  etapaAtual=id;topo(id);
  if(id==null)visao();else etapa(id);
  scrollTo(0,0);
}
addEventListener('hashchange',rota);
rota();

}).catch(e=>{document.getElementById('app').innerHTML='<p style="padding:16px">Não consegui carregar <code>etapas.json</code> e <code>cenas.json</code>. O navegador bloqueia isso em arquivo local: rode <code>npx serve</code> nesta pasta e abra o endereço que ele mostrar.</p>'});
</script>
